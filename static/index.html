<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>事件证据时间线</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=19">
  <script defer src="common.js?v=19"></script>
  <script defer src="home.js?v=19"></script>
</head>
<body>
  <header class="masthead"><div class="wrap">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><h1>事件证据时间线</h1></div>
  </div></header>
  <main class="wrap">
    <section class="home-hero" aria-labelledby="query-title">
      <h2 id="query-title" class="intro">查一条消息的来龙去脉</h2>
      <p class="muted">公告、新闻、研报、网帖，按时间核对</p>
      <form id="query-form" novalidate class="panel query-panel">
        <fieldset id="fields">
          <div class="query-fields">
            <div><label for="company">公司</label>
              <input id="company" type="search" placeholder="公司名称或代码" autocomplete="off">
              <div id="candidates" aria-live="polite"></div><div id="selection" class="inline"></div>
            </div>
            <div><label for="topic">事件</label><input id="topic" placeholder="事件关键词，如 回购金额" maxlength="60"></div>
            <button class="primary submit" type="submit">查询</button>
          </div>
          <p id="simulate-note" class="message warning" hidden>已开启：模拟公告获取失败<button type="button" class="text-button" id="simulate-off">关闭</button></p>
          <div class="query-foot">
            <p id="quota" class="muted">正在读取查询额度…</p>
          </div>
        </fieldset>
      </form>
      <div id="feedback" aria-live="polite"></div>
    </section>
    <section class="home-section" aria-labelledby="examples-title"><h2 id="examples-title">事件</h2>
      <div id="examples" class="event-grid">正在读取示例…</div></section>
    <section id="query-section" class="home-section" hidden><h2>最近查询</h2><div id="queries" class="event-grid"></div></section>
    <section class="home-section"><h2>示例自选股</h2><p id="watch-note" class="muted">示例名单，非真实持仓</p><div id="watchlist" class="tags"></div></section>
    <section class="home-section extras" aria-labelledby="extras-title">
      <h2 id="extras-title">示例场景</h2>
      <p class="muted">虚构公司，演示更正、过期、说法相反、数据缺失</p>
      <div id="scenarios" class="demo-list">正在读取示例…</div>
      <div class="simulate">
        <label class="check"><input id="simulate" type="checkbox" aria-describedby="simulate-help">模拟公告获取失败</label>
        <small id="simulate-help">下一次查询生效</small>
      </div>
      <p id="synthetic-stocks" class="muted" hidden></p>
    </section>
    <details class="panel"><summary>判断规则</summary>
      <div id="rules">正在读取规则…</div>
    </details>
  </main>
  <footer class="wrap">数据来源：同花顺 iFinD（公告、新闻检索）、扶摇（个股新闻、行业分类）。AI：DeepSeek，只负责读原文。<div>只整理公开信息，不预测涨跌，不给买卖建议。</div></footer>
</body>
</html>
